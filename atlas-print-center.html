<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas Print Center</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#eef2f7;color:#172033}.top{background:#101c36;color:#fff;padding:16px 22px;border-bottom:3px solid #e5a900;display:flex;justify-content:space-between;align-items:center}.top h1{font-size:20px;margin:0}.top a{color:#fff;text-decoration:none;border:1px solid #53617b;padding:9px 14px;border-radius:9px}.wrap{max-width:1380px;margin:18px auto;padding:0 16px;display:grid;grid-template-columns:390px 1fr;gap:16px}.card{background:#fff;border:1px solid #d9e0ea;border-radius:14px;box-shadow:0 5px 20px #17203312;overflow:hidden}.card h2{font-size:16px;margin:0;padding:14px 16px;border-bottom:1px solid #e4e9f0}.body{padding:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{display:block;font-size:12px;font-weight:800;color:#5b6880;margin-bottom:5px}input,select,textarea{width:100%;padding:10px;border:1px solid #ccd5e2;border-radius:8px;background:#fff;font:inherit}textarea{min-height:65px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:10px 13px;font-weight:800;cursor:pointer}.primary{background:#b91c1c;color:#fff;border-color:#b91c1c}.dark{background:#172033;color:#fff}.danger{color:#b91c1c}.status{font-size:13px;margin-top:10px;min-height:18px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}.list{max-height:650px;overflow:auto}.item{border:1px solid #dbe2ec;border-radius:10px;padding:12px;margin-bottom:9px;cursor:pointer}.item:hover,.item.sel{border-color:#2563eb;background:#eff6ff}.item strong{display:block}.muted{font-size:12px;color:#68758b;margin-top:4px}.badge{display:inline-block;font-size:10px;font-weight:900;padding:3px 7px;border-radius:99px;background:#dcfce7;color:#166534;margin-left:5px}.row{display:grid;grid-template-columns:1fr 210px 105px;gap:8px;align-items:center;border-bottom:1px solid #edf0f5;padding:9px 0}.row b{font-size:13px}.row small{display:block;color:#68758b}@media(max-width:980px){.wrap,.cols{grid-template-columns:1fr}.wrap{margin-top:10px}.row{grid-template-columns:1fr}.list{max-height:none}}</style></head><body>
<div class="top"><div><h1>🖨️ Atlas Print Center</h1><small>Impressoras, calibração e perfil padrão por obra</small></div><a href="etiqueta-config.html">Voltar ao Label Studio</a></div>
<div class="wrap"><section class="card"><h2>Cadastro do perfil</h2><div class="body"><input id="id" type="hidden"><div class="grid">
<div class="full"><label>Nome do perfil</label><input id="nome" value="Elgin L42 Pro Full — 55x35"></div><div><label>Fabricante</label><input id="fabricante" value="Elgin"></div><div><label>Modelo</label><input id="modelo" value="L42 Pro Full"></div>
<div><label>Largura do papel (mm)</label><input id="largura" type="number" step="0.1" value="55"></div><div><label>Altura do papel (mm)</label><input id="altura" type="number" step="0.1" value="35"></div>
<div><label>Largura da arte (mm)</label><input id="arteW" type="number" step="0.1" value="50"></div><div><label>Altura da arte (mm)</label><input id="arteH" type="number" step="0.1" value="31"></div>
<div><label>Deslocamento horizontal (mm)</label><input id="x" type="number" step="0.1" value="0"></div><div><label>Deslocamento vertical (mm)</label><input id="y" type="number" step="0.1" value="0"></div>
<div><label>Escala</label><input id="escala" type="number" step="0.01" value="1"></div><div><label>Orientação</label><select id="orientacao"><option>RETRATO</option><option>PAISAGEM</option></select></div>
<div><label><input id="ativo" type="checkbox" checked style="width:auto"> Perfil ativo</label></div><div><label><input id="padrao" type="checkbox" style="width:auto"> Padrão global</label></div>
<div class="full"><label>Observação</label><textarea id="obs" placeholder="Ex.: perfil aprovado após teste físico na obra CD"></textarea></div></div>
<div class="actions"><button class="btn primary" id="salvar">Salvar perfil global</button><button class="btn" id="novo">Novo</button><button class="btn danger" id="excluir">Excluir</button><button class="btn dark" id="teste">Imprimir teste</button></div><div class="status" id="status"></div></div></section>
<section class="cols"><div class="card"><h2>Perfis cadastrados</h2><div class="body list" id="perfis"></div></div><div class="card"><h2>Perfil padrão por obra</h2><div class="body"><p class="muted">Cada patrimônio usa automaticamente o perfil vinculado à sua obra. Sem vínculo, será usado o perfil global padrão.</p><div id="obras"></div></div></div></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./JS/supabaseClient.js"></script><script src="./JS/atlasPrintCenter.js?v=1.0.0"></script>
<script>
const $=s=>document.querySelector(s),PC=window.AtlasPrintCenter;let perfis=[],vinculos=[];const msg=(t,e=false)=>{$('#status').textContent=t;$('#status').style.color=e?'#b91c1c':'#166534'};
function valor(id){return $(id).value}function limpar(){['#id','#obs'].forEach(x=>$(x).value='');$('#nome').value='Novo perfil';$('#fabricante').value='';$('#modelo').value='';$('#largura').value=55;$('#altura').value=35;$('#arteW').value=50;$('#arteH').value=31;$('#x').value=0;$('#y').value=0;$('#escala').value=1;$('#ativo').checked=true;$('#padrao').checked=false}
function preencher(p){$('#id').value=p.id;$('#nome').value=p.nome;$('#fabricante').value=p.fabricante;$('#modelo').value=p.modelo;$('#largura').value=p.largura_mm;$('#altura').value=p.altura_mm;$('#arteW').value=p.arte_largura_mm;$('#arteH').value=p.arte_altura_mm;$('#x').value=p.deslocamento_x_mm;$('#y').value=p.deslocamento_y_mm;$('#escala').value=p.escala;$('#orientacao').value=p.orientacao;$('#ativo').checked=p.ativo;$('#padrao').checked=p.padrao_global;$('#obs').value=p.observacao||''}
function form(){return{id:valor('#id')||null,nome:valor('#nome'),fabricante:valor('#fabricante'),modelo:valor('#modelo'),largura_mm:valor('#largura'),altura_mm:valor('#altura'),arte_largura_mm:valor('#arteW'),arte_altura_mm:valor('#arteH'),deslocamento_x_mm:valor('#x'),deslocamento_y_mm:valor('#y'),escala:valor('#escala'),orientacao:valor('#orientacao'),ativo:$('#ativo').checked,padrao_global:$('#padrao').checked,observacao:valor('#obs')}}
async function carregar(){try{perfis=await PC.listarPerfis();vinculos=await PC.listarVinculos();renderPerfis();await renderObras()}catch(e){console.error(e);msg('Execute primeiro o SQL do Print Center no Supabase.',true)}}
function renderPerfis(){$('#perfis').innerHTML=perfis.map(p=>`<div class="item" data-id="${p.id}"><strong>${p.nome}${p.padrao_global?'<span class="badge">PADRÃO</span>':''}</strong><div class="muted">${p.fabricante} ${p.modelo} • ${p.largura_mm}×${p.altura_mm} mm • X ${p.deslocamento_x_mm} / Y ${p.deslocamento_y_mm} • escala ${p.escala}</div></div>`).join('')||'<p>Nenhum perfil cadastrado.</p>';document.querySelectorAll('.item').forEach(el=>el.onclick=()=>preencher(perfis.find(p=>String(p.id)===el.dataset.id)))}
async function renderObras(){const {data,error}=await window.client.from('obras').select('id,nome,codigo_obra,empresa_id,ativa,ativo').order('nome');if(error)throw error;const map=new Map(vinculos.map(v=>[String(v.obra_id),String(v.perfil_impressao_id)]));$('#obras').innerHTML=(data||[]).filter(o=>o.ativa!==false&&o.ativo!==false).map(o=>`<div class="row"><div><b>${o.codigo_obra?o.codigo_obra+' — ':''}${o.nome}</b><small>Obra ID ${o.id}</small></div><select data-obra="${o.id}"><option value="">Usar padrão global</option>${perfis.filter(p=>p.ativo).map(p=>`<option value="${p.id}" ${map.get(String(o.id))===String(p.id)?'selected':''}>${p.nome}</option>`).join('')}</select><button class="btn" data-save="${o.id}">Salvar</button></div>`).join('');document.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{const id=b.dataset.save,sel=document.querySelector(`[data-obra="${id}"]`);try{sel.value?await PC.vincularObra(id,sel.value):await PC.desvincularObra(id);msg('Vínculo da obra salvo.');vinculos=await PC.listarVinculos()}catch(e){msg(e.message,true)}})}
$('#salvar').onclick=async()=>{try{await PC.salvarPerfil(form());msg('Perfil salvo globalmente.');await carregar()}catch(e){console.error(e);msg(e.message,true)}};$('#novo').onclick=limpar;$('#excluir').onclick=async()=>{const id=valor('#id');if(!id)return msg('Selecione um perfil.',true);if(!confirm('Excluir este perfil?'))return;try{await PC.excluirPerfil(id);limpar();await carregar();msg('Perfil excluído.')}catch(e){msg(e.message,true)}};$('#teste').onclick=()=>{const id=valor('#id');if(!id)return msg('Salve ou selecione um perfil antes do teste.',true);window.open(`etiqueta-impressao.html?codigo=PAT-9990004&perfil_id=${id}`,'_blank')};carregar();
</script></body></html>
