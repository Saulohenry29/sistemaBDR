<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Etiquetas em lote - Atlas/BDR</title>
<script src="./JS/atlasEtiquetaConfig.js"></script>
<style>
@page{size:55mm 35mm;margin:0}
*{box-sizing:border-box}
:root{
  --etq-largura:55mm;--etq-altura:35mm;--etq-padding:2mm;--etq-borda:.45mm;--etq-raio:2mm;
  --etq-engrenagem:8mm;--etq-bdr:10.2mm;--etq-sub:2.5mm;--etq-qr:12.5mm;--etq-topo-altura:13.5mm;
  --etq-info:2.75mm;--etq-codigo:4mm;--etq-line-height:1.18;
  --etq-conteudo-x:0mm;--etq-conteudo-y:0mm;--etq-engrenagem-x:0mm;--etq-engrenagem-y:0mm;--etq-bdr-x:0mm;--etq-bdr-y:0mm;--etq-sub-x:0mm;--etq-sub-y:0mm;--etq-qr-x:0mm;--etq-qr-y:0mm;--etq-info-x:0mm;--etq-info-y:0mm;--etq-codigo-x:0mm;--etq-codigo-y:0mm
}
html,body{margin:0;padding:0;background:#fff;font-family:Arial,sans-serif}
.etiqueta{
  width:var(--etq-largura);height:var(--etq-altura);padding:var(--etq-padding);
  border:var(--etq-borda) solid #000;border-radius:var(--etq-raio);background:#fff;
  display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;
  page-break-after:always;break-after:page;transform:translate(var(--etq-conteudo-x),var(--etq-conteudo-y));
}
.etiqueta:last-child{page-break-after:auto;break-after:auto}
.topo{height:var(--etq-topo-altura);display:flex;justify-content:space-between;align-items:flex-start;min-width:0}
.logo-bloco{min-width:0;max-width:calc(100% - var(--etq-qr) - 1.5mm)}
.logo{display:flex;align-items:center;line-height:1;white-space:nowrap}
.engrenagem{width:var(--etq-engrenagem);height:var(--etq-engrenagem);object-fit:contain;flex:none;transform:translate(var(--etq-engrenagem-x),var(--etq-engrenagem-y))}
.bdr{font-size:var(--etq-bdr);font-weight:900;letter-spacing:-.7mm;color:#4b4b4b;line-height:.85;transform:translate(var(--etq-bdr-x),var(--etq-bdr-y))}
.sub{font-size:var(--etq-sub);font-style:italic;font-weight:700;text-align:right;margin-top:-.9mm;color:#555;transform:translate(var(--etq-sub-x),var(--etq-sub-y))}
.qr{width:var(--etq-qr);height:var(--etq-qr);object-fit:contain;flex:none;transform:translate(var(--etq-qr-x),var(--etq-qr-y))}
.meio{font-size:var(--etq-info);font-weight:800;line-height:var(--etq-line-height);min-width:0;overflow:hidden;transform:translate(var(--etq-info-x),var(--etq-info-y))}
.linha{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.codigo{font-size:var(--etq-codigo);font-weight:900;line-height:1;text-align:right;white-space:nowrap;transform:translate(var(--etq-codigo-x),var(--etq-codigo-y))}
.estado{padding:12px;font-weight:800;color:#334155}
@media screen{body{display:grid;gap:10px;justify-content:center;padding:14px;background:#e5e7eb}.etiqueta{box-shadow:0 5px 18px rgba(15,23,42,.18)}}
@media print{html,body{width:55mm;margin:0!important;padding:0!important;background:#fff}.etiqueta{box-shadow:none}}
</style>
</head>
<body>
<div id="etiquetas"><div class="estado">Carregando etiquetas...</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="./JS/supabaseClient.js"></script>
<script>
AtlasEtiquetaConfig.aplicar();
window.addEventListener('atlas:etiqueta-config-alterada', event => AtlasEtiquetaConfig.aplicar(event.detail));

const params = new URLSearchParams(location.search);
const codigos = (params.get('codigos') || '').split(',').map(v => v.trim()).filter(Boolean).slice(0,200);
const container = document.getElementById('etiquetas');
const db = () => window.client || window.supabaseClient;
const esc = valor => String(valor ?? '-').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const cortarTexto = (texto, limite) => {
  const valor = String(texto || '-');
  return valor.length > limite ? `${valor.substring(0, limite)}...` : valor;
};
const qrUrl = codigo => `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(`https://saulohenry29.github.io/sistemaBDR/etiqueta.html?id=${codigo}`)}`;

function modelo(p){
  const config = AtlasEtiquetaConfig.carregar();
  const codigo = p.codigo_qr || p.codigo_antigo || 'SEM-CODIGO';
  const local = cortarTexto(p.localizacao || p.obra_nome || 'SEM OBRA', config.limiteLocal);
  const item = cortarTexto(p.nome_bem || 'ITEM', config.limiteItem);
  return `<section class="etiqueta">
    <div class="topo">
      <div class="logo-bloco">
        <div class="logo"><img src="./imagens/engrenagem.png" class="engrenagem" alt=""><span class="bdr">BDR</span></div>
        <div class="sub">Construart</div>
      </div>
      <img class="qr" src="${qrUrl(codigo)}" alt="QR ${esc(codigo)}">
    </div>
    <div class="meio">
      <div class="linha">Local: ${esc(local)}</div>
      <div class="linha">Item: ${esc(item)}</div>
    </div>
    <div class="codigo">${esc(codigo)}</div>
  </section>`;
}

async function carregar(){
  if(!codigos.length){container.innerHTML='<div class="estado">Nenhuma etiqueta selecionada.</div>';return}
  let dados=[];
  if(db()){
    const resposta = await db().from('patrimonio').select('codigo_qr,codigo_antigo,nome_bem,localizacao').in('codigo_qr',codigos);
    if(!resposta.error) dados = resposta.data || [];
    else console.error('Erro ao carregar etiquetas em lote:', resposta.error);
  }
  const mapa = new Map(dados.map(p => [String(p.codigo_qr),p]));
  container.innerHTML = codigos.map(c => modelo(mapa.get(c) || {codigo_qr:c})).join('');
  await Promise.all(Array.from(container.querySelectorAll('img')).map(img => img.complete ? Promise.resolve() : new Promise(resolve => {img.onload=resolve;img.onerror=resolve})));
  if(params.get('auto') === '1') setTimeout(() => window.print(),250);
}
carregar();
</script>
</body>
</html>
