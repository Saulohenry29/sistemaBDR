<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Etiquetas em lote — Atlas/BDR</title>

<!-- Usa a MESMA configuração estável da impressão individual. -->
<script src="./JS/atlasEtiquetaConfig.js?v=8.1.1"></script>
<script src="./JS/atlasQRCode/qrcode.min.js?v=1.0.0"></script>
<script src="./JS/atlasQRCode.js?v=1.0.0"></script>

<style>
*{box-sizing:border-box}

:root{
  --papel-w:55mm;--papel-h:35mm;--arte-w:53mm;--arte-h:33mm;
  --padding:1.7mm;--borda:.45mm;--raio:1.8mm;
  --topo-h:13.5mm;--gear-size:8mm;--bdr-size:10.2mm;
  --sub-size:2.5mm;--qr-size:12.5mm;
  --local-size:2.65mm;--item-size:2.65mm;--codigo-size:4mm;

  --gear-x:0mm;--gear-y:0mm;--bdr-x:0mm;--bdr-y:0mm;
  --sub-x:0mm;--sub-y:0mm;--qr-x:0mm;--qr-y:0mm;
  --local-x:0mm;--local-y:0mm;--item-x:0mm;--item-y:0mm;
  --codigo-x:0mm;--codigo-y:0mm;

  --font-bdr:Arial,sans-serif;--weight-bdr:900;--style-bdr:normal;
  --transform-bdr:uppercase;--letter-bdr:-.65mm;--align-bdr:left;

  --font-sub:Arial,sans-serif;--weight-sub:700;--style-sub:italic;
  --transform-sub:none;--letter-sub:0mm;--align-sub:right;

  --font-local:Arial,sans-serif;--weight-local:800;--style-local:normal;
  --transform-local:none;--letter-local:0mm;--align-local:left;

  --font-item:Arial,sans-serif;--weight-item:800;--style-item:normal;
  --transform-item:none;--letter-item:0mm;--align-item:left;

  --font-codigo:Arial,sans-serif;--weight-codigo:900;--style-codigo:normal;
  --transform-codigo:uppercase;--letter-codigo:0mm;--align-codigo:right;

  --print-x:-1mm;--print-y:0mm;--print-scale:1;
}

@page{
  size:var(--papel-w) var(--papel-h);
  margin:0;
}

html,body{
  margin:0;
  padding:0;
  background:#fff;
  font-family:Arial,sans-serif;
}

#etiquetas{
  margin:0;
  padding:0;
}

.paper{
  position:relative;
  width:var(--papel-w);
  height:var(--papel-h);
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  flex:none;
  page-break-after:always;
  break-after:page;
}

.paper:last-child{
  page-break-after:auto;
  break-after:auto;
}

.label{
  position:relative;
  width:var(--arte-w);
  height:var(--arte-h);
  padding:var(--padding);
  border:0;
  border-radius:var(--raio);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  overflow:hidden;
  background:#fff;
  transform:translate(var(--print-x),var(--print-y)) scale(var(--print-scale));
  transform-origin:center center;
  isolation:isolate;
}

.label::after{
  content:"";
  position:absolute;
  inset:0;
  border:var(--borda) solid #111;
  border-radius:inherit;
  pointer-events:none;
  z-index:10;
}

.label-top{
  height:var(--topo-h);
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  min-width:0;
}

.brand{
  min-width:0;
  max-width:calc(100% - var(--qr-size) - 1.5mm);
}

.brand-row{
  display:flex;
  align-items:center;
  white-space:nowrap;
  line-height:1;
}

.gear{
  width:var(--gear-size);
  height:var(--gear-size);
  object-fit:contain;
  flex:none;
  transform:translate(var(--gear-x),var(--gear-y));
}

.bdr{
  font-family:var(--font-bdr);
  font-size:var(--bdr-size);
  font-weight:var(--weight-bdr);
  font-style:var(--style-bdr);
  text-transform:var(--transform-bdr);
  letter-spacing:var(--letter-bdr);
  text-align:var(--align-bdr);
  color:#4b4b4b;
  line-height:.85;
  transform:translate(var(--bdr-x),var(--bdr-y));
}

.sub{
  font-family:var(--font-sub);
  font-size:var(--sub-size);
  font-weight:var(--weight-sub);
  font-style:var(--style-sub);
  text-transform:var(--transform-sub);
  letter-spacing:var(--letter-sub);
  text-align:var(--align-sub);
  color:#555;
  margin-top:-.7mm;
  transform:translate(var(--sub-x),var(--sub-y));
}

.qr{
  width:var(--qr-size);
  height:var(--qr-size);
  object-fit:contain;
  flex:none;
  background:#fff;
  transform:translate(var(--qr-x),var(--qr-y));
}

.info{
  min-width:0;
  overflow:hidden;
  line-height:1.15;
}

.local,.item{
  display:block;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.local{
  font-family:var(--font-local);
  font-size:var(--local-size);
  font-weight:var(--weight-local);
  font-style:var(--style-local);
  text-transform:var(--transform-local);
  letter-spacing:var(--letter-local);
  text-align:var(--align-local);
  transform:translate(var(--local-x),var(--local-y));
}

.item{
  font-family:var(--font-item);
  font-size:var(--item-size);
  font-weight:var(--weight-item);
  font-style:var(--style-item);
  text-transform:var(--transform-item);
  letter-spacing:var(--letter-item);
  text-align:var(--align-item);
  transform:translate(var(--item-x),var(--item-y));
}

.codigo{
  font-family:var(--font-codigo);
  font-size:var(--codigo-size);
  font-weight:var(--weight-codigo);
  font-style:var(--style-codigo);
  text-transform:var(--transform-codigo);
  letter-spacing:var(--letter-codigo);
  text-align:var(--align-codigo);
  white-space:nowrap;
  line-height:1;
  transform:translate(var(--codigo-x),var(--codigo-y));
}

.estado{
  padding:18px;
  font-weight:800;
  color:#334155;
}

/* Visualização no navegador: papel branco, sem alterar a impressão. */
@media screen{
 html,body{
   width:100%;
   min-width:100%;
   min-height:100%;
   background:#fff!important;
 }
 body{
   display:grid;
   gap:18px;
   justify-content:center;
   padding:18px;
 }
 .paper{
   background:#fff;
   outline:0;
   box-shadow:none;
 }
 .label{
   box-shadow:0 8px 22px rgba(15,23,42,.18);
 }
 body.embed{
   padding:16px;
 }
}
@media print{
  html,body,#etiquetas{
    margin:0!important;
    padding:0!important;
    background:#fff;
  }

  .paper{
    outline:0;
    box-shadow:none;
  }
}
</style>
</head>

<body>
<div id="etiquetas">
  <div class="estado">Preparando etiquetas...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./JS/supabaseClient.js"></script>

<script>
"use strict";

const A = window.AtlasEtiquetaConfig;
const QR = window.AtlasQRCode;
const params = new URLSearchParams(location.search);
const isEmbed = params.get("embed") === "1" || window.self !== window.top;
const modoB1 = params.get("b1") === "1";
const loteToken = params.get("loteToken") || "";
if(isEmbed){
  document.body.classList.add("embed");
}

const codigos = (params.get("codigos") || "")
  .split(",")
  .map(valor => valor.trim())
  .filter(Boolean)
  .slice(0, 200);

const container = document.getElementById("etiquetas");
const db = () => window.client || window.supabaseClient;

const esc = valor => String(valor ?? "-").replace(
  /[&<>'"]/g,
  caractere => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    "'":"&#39;",
    '"':"&quot;"
  })[caractere]
);



function criarModelo(patrimonio, qrDataURL){
  const codigo =
    patrimonio?.codigo_qr ||
    patrimonio?.codigo_bem ||
    patrimonio?.etiqueta ||
    patrimonio?.codigo_antigo ||
    "SEM-CODIGO";

  const local =
    patrimonio?.localizacao ||
    patrimonio?.obra_nome ||
    "SEM OBRA";

  const item =
    patrimonio?.nome_bem ||
    "ITEM";

  return `
    <section class="paper">
      <div class="label">

        <div class="label-top">
          <div class="brand">
            <div class="brand-row">
              <img
                src="./imagens/engrenagem.png"
                class="gear"
                data-el="engrenagem"
                alt=""
              >

              <span class="bdr" data-el="bdr">BDR</span>
            </div>

            <div class="sub" data-el="sub">Construart</div>
          </div>

          <img
            class="qr"
            data-el="qr"
            src="${qrDataURL}"
            alt="QR ${esc(codigo)}"
          >
        </div>

        <div class="info">
          <div class="local" data-el="local">
            Local: ${esc(local)}
          </div>

          <div class="item" data-el="item">
            Item: ${esc(item)}
          </div>
        </div>

        <div class="codigo" data-el="codigo">
          ${esc(codigo)}
        </div>

      </div>
    </section>
  `;
}

async function aguardarImagens(){
  const imagens = Array.from(container.querySelectorAll("img"));

  await Promise.all(
    imagens.map(imagem => {
      if(imagem.complete){
        return Promise.resolve();
      }

      return new Promise(resolve => {
        imagem.addEventListener("load", resolve, {once:true});
        imagem.addEventListener("error", resolve, {once:true});
      });
    })
  );
}

async function buscarPatrimonios(){
  if(!db()){
    console.warn("Supabase indisponível na impressão em lote.");
    return [];
  }

  /*
   * O patrimônio envia os códigos selecionados usando codigo_qr.
   * Mantemos a mesma consulta que já funcionava antes.
   */
  const resposta = await db()
    .from("patrimonio")
    .select("*")
    .in("codigo_qr", codigos);

  if(resposta.error){
    console.error(
      "Erro ao buscar patrimônios para a impressão em lote:",
      resposta.error
    );

    return [];
  }

  return resposta.data || [];
}

/*
 * B1: gera cada PNG no MESMO documento/Canvas da etiqueta individual.
 * O iframe residente é filho desta página, isolando os eventos da etiqueta
 * individual do modal do Patrimônio. Nenhum ajuste é feito no layout oficial.
 */
function esperarMensagemB1(frame, tipo, token=null, prazo=25000){
  return new Promise((resolve,reject) => {
    let timer;
    function limpar(){
      clearTimeout(timer);
      window.removeEventListener("message", receber);
    }
    function receber(event){
      if(event.origin !== location.origin || event.source !== frame.contentWindow) return;
      const dados = event.data || {};
      if(token !== null && String(dados.token || "") !== String(token)) return;
      if(dados.tipo === tipo){
        limpar();
        resolve(dados);
      }else if(dados.tipo === "ATLAS_ETIQUETA_ERRO"){
        limpar();
        reject(new Error("Falha ao gerar etiqueta " + (dados.codigo || "")));
      }
    }
    window.addEventListener("message", receber);
    timer = setTimeout(() => {
      limpar();
      reject(new Error("Tempo excedido ao preparar a imagem da etiqueta."));
    }, prazo);
  });
}

function criarGeradorB1(itens, ausentes){
  let gerando = false;
  return {
    pronta:ausentes.length === 0 && itens.length === codigos.length,
    total:itens.length,
    ausentes:ausentes.slice(),
    async gerarImagens(onProgress){
      if(this.pronta !== true) throw new Error("Existem patrimônios não encontrados; impressão bloqueada.");
      if(gerando) throw new Error("As imagens deste lote já estão sendo preparadas.");
      gerando = true;
      const frame = document.createElement("iframe");
      frame.setAttribute("title", "Gerador de etiquetas NIIMBOT B1");
      frame.setAttribute("aria-hidden", "true");
      frame.style.cssText = "position:fixed;left:-12000px;top:0;width:700px;height:420px;opacity:0;pointer-events:none;border:0";
      document.body.appendChild(frame);
      const imagens = [];
      try{
        const bridgePronta = esperarMensagemB1(frame,"ATLAS_ETIQUETA_BRIDGE_PRONTA");
        frame.src = "etiqueta-impressao.html?embed=1&preview=1&fast=1&v=20261114-b1auto02";
        await bridgePronta;
        for(let i=0;i<itens.length;i++){
          const p = itens[i];
          const token = `b1-lote-${loteToken}-${i}`;
          const pronta = esperarMensagemB1(frame,"ATLAS_ETIQUETA_PRONTA",token);
          frame.contentWindow.postMessage({
            tipo:"ATLAS_ETIQUETA_ATUALIZAR",
            dados:{
              token,
              codigo:p.codigo,
              codigo_qr:p.codigo,
              local:p.local,
              item:p.item,
              obra_id:p.obra_id,
              perfil_id:p.perfil_id
            }
          },location.origin);
          await pronta;
          const gerador = frame.contentWindow.AtlasEtiquetaImagemB1;
          if(!gerador?.gerar) throw new Error("Gerador oficial da NIIMBOT indisponível.");
          imagens.push(await gerador.gerar());
          if(typeof onProgress === "function") onProgress(i+1,itens.length);
        }
        return imagens;
      }finally{
        frame.remove();
        gerando = false;
      }
    }
  };
}

async function carregar(){
  if(!codigos.length){
    container.innerHTML =
      '<div class="estado">Nenhuma etiqueta selecionada.</div>';

    return;
  }

  /*
   * IMPORTANTE:
   * Não muda a versão do layout e não migra os valores já salvos.
   * Primeiro busca PADRAO_GLOBAL no Supabase.
   * Usa o localStorage apenas como plano B.
   */
  const configLocal = A.carregar();

  const [configBanco, patrimonios] = await Promise.all([
    A.carregarBanco().catch(erro => {
      console.warn(
        "Padrão global indisponível; usando configuração local.",
        erro
      );

      return null;
    }),

    buscarPatrimonios()
  ]);

  const config = configBanco || configLocal;

  const mapa = new Map(
    patrimonios.map(patrimonio => [
      String(patrimonio.codigo_qr),
      patrimonio
    ])
  );

  // Gera todos os QR localmente antes de montar as etiquetas.
  const qrPorCodigo = await QR.preGerarLista(codigos,{tamanho:220,nivel:"M"});

  container.innerHTML = codigos
    .map(codigo =>
      criarModelo(
        mapa.get(String(codigo)) || {codigo_qr: codigo},
        qrPorCodigo.get(String(codigo))
      )
    )
    .join("");

  /*
   * Aplica o padrão DEPOIS de inserir todas as etiquetas.
   * Isso aplica dimensões, fontes, borda, visibilidade, escala e X/Y.
   */
  A.aplicar(config);

  await aguardarImagens();

  if(modoB1){
    const ausentes = codigos.filter(codigo => !mapa.has(String(codigo)));
    const itens = codigos.filter(codigo => mapa.has(String(codigo))).map(codigo => {
      const p = mapa.get(String(codigo));
      return {
        codigo:String(codigo),
        local:p.localizacao || p.obra_nome || "SEM OBRA",
        item:p.nome_bem || "ITEM",
        obra_id:p.obra_id || null,
        perfil_id:p.perfil_impressao_id || null
      };
    });
    window.AtlasEtiquetasLoteB1 = criarGeradorB1(itens,ausentes);
    window.parent.postMessage({
      tipo:"ATLAS_ETIQUETAS_LOTE_B1_PRONTAS",
      loteToken,
      total:itens.length,
      ausentes
    },location.origin);
  }

  if(params.get("auto") === "1" && !isEmbed){
    requestAnimationFrame(() => requestAnimationFrame(() => window.print()));
  }
}

carregar().catch(error => {
  console.error("Atlas: erro ao preparar etiquetas em lote", error);
  container.innerHTML = '<div class="estado">Não foi possível preparar as etiquetas.</div>';
  if(modoB1){
    window.parent.postMessage({
      tipo:"ATLAS_ETIQUETAS_LOTE_B1_ERRO",
      loteToken,
      erro:String(error?.message || error)
    },location.origin);
  }
});
</script>
</body>
</html>
